name: Setup Missing Webhook
on:
  workflow_dispatch: # Allows you to manually trigger this via the GitHub Actions UI

jobs:
  create-new-webhook:
    runs-on: ubuntu-latest
    
    # ⬇️ CHANGED THIS LINE TO THE VALID ACTIONS SYNTAX KEY ⬇️
    permissions:
      repository-projects: write # This key covers webhook creation privileges
      
    steps:
      - name: Send API Request to Create Webhook
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ github.repository }}/hooks \
            -d '{
              "name": "web",
              "active": true,
              "events": ["push", "pull_request"],
              "config": {
                "url": "https://your-server-endpoint.com",
                "content_type": "json",
                "insecure_ssl": "0"
              }
            }'
