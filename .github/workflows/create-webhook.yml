name: Setup Missing Webhook
on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  create-new-webhook:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Safe default scope for checking code context
      
    steps:
      - name: Send API Request to Create Webhook
        run: |
          curl -g -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com{{ github.repository }}/hooks" \
            -d '{
              "name": "web",
              "active": true,
              "events": ["push", "pull_request"],
              "config": {
                "url": "https://your-server-endpoint.com",
                "content_type": "json",
                "insecure_ssl": "0"
              }
            }'
